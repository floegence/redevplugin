<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Existing application</title></head>
<body><label>Name <input name="name" value="Existing application"></label><output></output>
<script type="module">
const input = document.querySelector('input');
const output = document.querySelector('output');
input.addEventListener('input', () => { output.textContent = input.value; });
output.textContent = input.value;
</script></body></html>
