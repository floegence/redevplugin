[package]
name = "redevplugin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandboxed WASM execution runtime for the ReDevPlugin platform"
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["Cargo.toml", "LICENSE", "README.md", "src/**", "testdata/**", "proptest-regressions/**"]

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11"
wasmparser = "0.258"
wasmi = { version = "=2.0.0-beta.10", default-features = false, features = ["portable-dispatch", "std", "validate"] }

[dev-dependencies]
proptest = "1.6"
wat = "1"
