        runtime_target_os: { type: string }
        runtime_target_arch: { type: string }
        runtime_binary_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        os: { type: string }
        arch: { type: string }
        stream: { type: string }
        package_hash: { type: string }
        artifact: { type: string }
        plugin_instance_id: { type: string }
        store_id: { type: string }
        operation: { type: string }
        hostcall: { type: string }
        code: { type: string }
        connector_id: { type: string }
        transport: { type: string }
        revoke_epoch: { type: integer, minimum: 0, maximum: 9007199254740991 }
        stage_id: { type: string }
        reason: { type: string }
        surface_instance_id: { type: string }
    PluginDiagnosticEvent:
      type: object
      required: [type, severity, message]
      additionalProperties: false
      properties:
        event_id: { type: string }
        type: { type: string }
        severity: { type: string, enum: [info, warning] }
        message: { type: string }
        plugin_id: { type: string }
        plugin_instance_id: { type: string }
        surface_id: { type: string }
        surface_instance_id: { type: string }
        active_fingerprint: { type: string }
        request_id: { type: string }
        correlation_id: { type: string }
        mutation_outcome: { $ref: "#/components/schemas/DiagnosticMutationOutcome" }
        occurred_at: { type: string, format: date-time }
        details: { $ref: "#/components/schemas/PluginDiagnosticDetails" }
    PluginDiagnosticEventList:
      type: object
      required: [diagnostic_events]
      additionalProperties: false
      properties:
        diagnostic_events:
          type: array
          items: { $ref: "#/components/schemas/PluginDiagnosticEvent" }
    PluginRuntimeShardHealth:
      type: object
      description: Explicit public HTTP projection of runtime shard health. IPC channel credentials and connection nonces are excluded.
      required: [runtime_shard_id, runtime_instance_id, runtime_generation_id, artifact_identity, ready, active_invocations, queued_invocations, limits, module_cache]
      additionalProperties: false
      properties:
        runtime_shard_id: { type: string }
        runtime_instance_id: { type: string }
        runtime_generation_id: { type: string }
        artifact_identity: { $ref: "#/components/schemas/RuntimeArtifactIdentity" }
        ready: { type: boolean }
        active_invocations: { type: integer, minimum: 0 }
        queued_invocations: { type: integer, minimum: 0 }
        limits: { $ref: "#/components/schemas/RuntimeLimits" }
        module_cache: { $ref: "#/components/schemas/RuntimeModuleCacheMetrics" }
    PluginRuntimeHealth:
      type: object
      description: Explicit public HTTP projection of runtime manager health.
      required: [ready, artifact_identity, shards]
      additionalProperties: false
      properties:
        ready: { type: boolean }
        artifact_identity: { $ref: "#/components/schemas/RuntimeArtifactIdentity" }
        shards:
          type: array
          items: { $ref: "#/components/schemas/PluginRuntimeShardHealth" }
    RuntimeTarget:
      oneOf:
        - type: object
          required: [os, arch]
          additionalProperties: false
          properties:
            os: { const: darwin }
            arch: { const: amd64 }
        - type: object
          required: [os, arch]
          additionalProperties: false
          properties:
            os: { const: darwin }
            arch: { const: arm64 }
        - type: object
          required: [os, arch]
          additionalProperties: false
          properties:
            os: { const: linux }
            arch: { const: amd64 }
        - type: object
          required: [os, arch]
          additionalProperties: false
          properties:
            os: { const: linux }
            arch: { const: arm64 }
    RuntimeAdmissionTarget:
      type: string
      enum: [darwin/amd64, darwin/arm64, linux/amd64, linux/arm64]
    StrictSemVer:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
    RuntimeArtifactIdentity:
      type: object
      required: [platform_version, target, binary_sha256]
      additionalProperties: false
      properties:
        platform_version: { $ref: "#/components/schemas/StrictSemVer" }
        target: { $ref: "#/components/schemas/RuntimeAdmissionTarget" }
        binary_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    RuntimeLimits:
      type: object
      description: "Negotiated runtime capacities. per_plugin_concurrency must not exceed worker_count. Route capacities are derived exactly from negotiated limits: active hostcall routes = worker_count, canceled hostcall retention = worker_count + queue_capacity, and compile-flight artifact routes = worker_count."
      required: [worker_count, queue_capacity, per_plugin_concurrency, module_cache_entries, module_cache_source_bytes]
      additionalProperties: false
      properties:
        worker_count: { type: integer, minimum: 1, maximum: 64, description: "Number of runtime worker threads." }
        queue_capacity: { type: integer, minimum: 1, maximum: 64, description: "Maximum queued worker invocations." }
        per_plugin_concurrency: { type: integer, minimum: 1, maximum: 64, description: "Maximum concurrent invocations for one plugin; must not exceed worker_count." }
        module_cache_entries: { type: integer, minimum: 1, maximum: 1024, description: "Maximum compiled modules retained by the runtime cache." }
        module_cache_source_bytes: { type: integer, minimum: 1, maximum: 134217728, description: "Maximum source WASM bytes retained by the runtime cache (128 MiB)." }
    RuntimeModuleCacheMetrics:
      type: object
      required: [hits, misses, compiles, entries, source_bytes]
      additionalProperties: false
      properties:
        hits: { type: integer, minimum: 0, maximum: 9007199254740991 }
        misses: { type: integer, minimum: 0, maximum: 9007199254740991 }
        compiles: { type: integer, minimum: 0, maximum: 9007199254740991 }
        entries: { type: integer, minimum: 0, maximum: 1024 }
        source_bytes: { type: integer, minimum: 0, maximum: 134217728 }
    PluginRuntimeStopResult:
      type: object
      required: [stopped]
      additionalProperties: false
      properties:
        stopped: { const: true }
    RecoverySnapshot:
      type: object
      required: [revision, complete, results]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        complete: { type: boolean }
        results:
          type: array
          items: { $ref: "#/components/schemas/PluginRecoveryResult" }
    PluginRecoveryResult:
      type: object
      required: [plugin_instance_id, status]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ready, failed]
        reason:
          type: string
          enum: [unknown, trust_state_advanced, trust_revoked, recovery_canceled, recovery_timeout]
        action:
          type: string
          enum: [retry, reinstall, contact_admin]
    RetryPluginRecoveryRequest:
      type: object
      required: [plugin_instance_id]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
    PluginDataExportResult:
      type: object
      required: [bundle_ref]
      additionalProperties: false
      properties:
        bundle_ref: { type: string, minLength: 1 }
    PluginDataExportDeleteResult:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted: { const: true }
    PluginSecretBindResult:
      type: object
      required: [bound]
      additionalProperties: false
      properties:
        bound: { const: true }
    PluginSecretTestResult:
      type: object
      required: [tested]
      additionalProperties: false
      properties:
        tested: { const: true }
    PluginSecretDeleteResult:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted: { const: true }
    PluginSettingsField:
      type: object
      required: [key, type, label, scope]
      additionalProperties: false
      properties:
        key: { type: string }
        type: { type: string }
        label: { type: string }
        scope: { $ref: "#/components/schemas/ResourceScopeKind" }
        default: true
        secret_ref: { type: string }
        options:
          type: array
          items: { type: string }
        validation:
          type: object
          additionalProperties: true
    PluginSettingsSchema:
      type: object
      description: Explicit public HTTP projection of the settings schema for one owner scope.
      required: [plugin_instance_id, scope, schema_version, fields, values_revision]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string }
        scope: { $ref: "#/components/schemas/ResourceScopeKind" }
        schema_version: { type: integer, minimum: 1 }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PluginSettingsField" }
        values_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
    PluginSettingsSnapshot:
      type: object
      description: Explicit public HTTP projection of settings values and redacted secret metadata for one owner scope.
      required: [plugin_instance_id, scope, schema_version, values_revision, values, secret_metadata]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string }
        scope: { $ref: "#/components/schemas/ResourceScopeKind" }
        schema_version: { type: integer, minimum: 1 }
        values_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        values:
          type: object
          additionalProperties: true
        secret_metadata:
          type: array
          items: { $ref: "#/components/schemas/PluginSettingsSecretMetadata" }
    PluginSettingsSecretMetadata:
      type: object
      required: [key, secret_ref, scope, bound]
      additionalProperties: false
      properties:
        key: { type: string, minLength: 1 }
        secret_ref: { type: string, minLength: 1 }
        scope: { type: string, enum: [user, environment] }
        bound: { type: boolean }
        last_test_status: { type: string }
        bound_at: { type: string, format: date-time }
        tested_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExternalPackageIntentRequest:
      description: Closed install or update intent. Update concurrency values are supplied by the caller, while package identity is always derived from the inspected artifact.
      oneOf:
        - type: object
          required: [action]
          additionalProperties: false
          properties:
            action: { const: install }
        - type: object
          required: [action, plugin_instance_id, expected_management_revision]
          additionalProperties: false
          properties:
            action: { const: update }
            plugin_instance_id: { type: string, minLength: 1 }
            expected_management_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
    ExternalPackageIntent:
      description: Server-resolved install or update intent. The platform generates the install instance identifier during inspection.
      oneOf:
        - type: object
          required: [action, plugin_instance_id]
          additionalProperties: false
          properties:
            action: { const: install }
            plugin_instance_id: { type: string, minLength: 1 }
        - type: object
          required: [action, plugin_instance_id, expected_management_revision]
          additionalProperties: false
          properties:
            action: { const: update }
            plugin_instance_id: { type: string, minLength: 1 }
            expected_management_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
    ExternalPackageSource:
      description: Caller-selected external source. Redirect resolution, package hashes, identity, and provenance are derived by the platform.
      oneOf:
        - type: object
          required: [kind, url]
          additionalProperties: false
          properties:
            kind: { const: package_url }
            url: { type: string, format: uri, minLength: 1 }
        - type: object
          required: [kind, url]
          additionalProperties: false
          properties:
            kind: { const: github_repository }
            url: { type: string, format: uri, minLength: 1 }
            tag:
              type: string
              minLength: 1
              maxLength: 255
              description: Optional exact release tag. When omitted, the resolver selects the repository's latest eligible release.
    InspectExternalPackageRequest:
      type: object
      description: Requests server-side inspection. Trust, hashes, package identity, approval, provenance, signature assessment, and update eligibility are intentionally not caller-controlled.
      required: [intent, source]
      additionalProperties: false
      properties:
        intent: { $ref: "#/components/schemas/ExternalPackageIntentRequest" }
        source: { $ref: "#/components/schemas/ExternalPackageSource" }
    InstallInspectedPackageRequest:
      type: object
      description: Confirms an unexpired process-local inspection by its exact package digest. A successful install is enabled; only a later explicit disable mutation can persist disabled_by_user.
      required: [inspection_id, expected_package_sha256]
      additionalProperties: false
      properties:
        inspection_id: { type: string, minLength: 1 }
        expected_package_sha256: { type: string, pattern: "^(sha256:)?[0-9a-f]{64}$" }
    InspectReleasePackageRequest:
      type: object
      required: [plugin_instance_id, release_ref]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        release_ref: { $ref: "#/components/schemas/PluginReleaseRef" }
    ExternalPackageSignatureAssessment:
      type: object
      description: Cryptographic signature fact computed over the inspected artifact. The absent state is installable and affects trust classification and automatic-update eligibility only.
      required: [state, reason_codes, assessed_hashes, assessed_at]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [verified, absent, unknown_signer, invalid, revoked, unavailable]
        reason_codes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        assessed_hashes: { $ref: "#/components/schemas/TrustHashSet" }
        algorithm: { type: string, minLength: 1 }
        key_id: { type: string, minLength: 1 }
        assessed_at: { type: string, format: date-time }
        assessment_epoch: { type: string, minLength: 1 }
    ExternalPackageRedirectHop:
      type: object
      description: Credential-free redirect projection. Userinfo, query strings, and fragments are never exposed.
      required: [origin, path]
      additionalProperties: false
      properties:
        origin: { type: string, format: uri, minLength: 1 }
        path: { type: string, pattern: "^/" }
    ExternalPackageSourceProvenance:
      description: Stable, credential-free source provenance computed after URL, GitHub release, or uploaded-package resolution. Upload identifiers are opaque server-generated values and cannot be supplied by callers.
      oneOf:
        - type: object
          required: [kind, source_origin, source_path, redirect_chain, package_sha256, resolved_at]
          additionalProperties: false
          properties:
            kind: { const: package_url }
            source_origin: { type: string, format: uri, minLength: 1 }
            source_path: { type: string, pattern: "^/" }
            redirect_chain:
              type: array
              items: { $ref: "#/components/schemas/ExternalPackageRedirectHop" }
            package_sha256: { type: string, pattern: "^(sha256:)?[0-9a-f]{64}$" }
            resolved_at: { type: string, format: date-time }
        - type: object
          required: [kind, upload_id, package_sha256, resolved_at]
          additionalProperties: false
          properties:
            kind: { const: package_upload }
            upload_id:
              type: string
              minLength: 1
              description: Opaque server-generated identifier for the staged uploaded artifact.
            package_sha256: { type: string, pattern: "^(sha256:)?[0-9a-f]{64}$" }
            resolved_at: { type: string, format: date-time }
        - type: object
          required: [kind, repository_id, release_id, asset_id, repository_url, owner, repository, resolved_commit_sha, package_sha256, resolved_at]
          additionalProperties: false
          properties:
            kind: { const: github_repository }
            repository_id:
              type: string
              pattern: "^[1-9][0-9]*$"
              description: Stable GitHub repository database ID encoded as decimal text.
            release_id:
              type: string
              pattern: "^[1-9][0-9]*$"
              description: Stable GitHub release database ID encoded as decimal text.
            asset_id:
              type: string
              pattern: "^[1-9][0-9]*$"
              description: Stable GitHub release asset database ID encoded as decimal text.
            repository_url: { type: string, format: uri, minLength: 1 }
            owner:
              type: string
              minLength: 1
              description: Display-only owner login; repository_id remains authoritative across renames.
            repository:
              type: string
              minLength: 1
              description: Display-only repository name; repository_id remains authoritative across renames.
            resolved_commit_sha: { type: string, pattern: "^[0-9a-f]{40}$" }
            release_tag: { type: string, minLength: 1 }
            asset_name: { type: string, minLength: 1 }
            package_sha256: { type: string, pattern: "^(sha256:)?[0-9a-f]{64}$" }
            resolved_at: { type: string, format: date-time }
    ExternalPackageExecutionApproval:
      type: object
      description: Execution decision independent from signature state. Session and owner hashes are excluded from this public projection.
      required: [state, reason_codes, assessed_at]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [pending, user_approved, policy_approved, policy_blocked]
        reason_codes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        assessed_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time }
    ExternalPackageUpdateEligibility:
      type: object
      description: Automatic-update decision. Unsigned or otherwise unverified packages remain installable but are normally manual-only.
      required: [state, reason_codes, assessed_at]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [manual_only, automatic_eligible]
        reason_codes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        assessed_at: { type: string, format: date-time }
    ExternalPackagePermissionSummary:
      type: object
      description: Host-derived permission presentation for the inspected package. Grants remain separate explicit mutations, and effects summarize the verified methods that require each permission.
      required: [permission_id, methods, required, effects]
      additionalProperties: false
      properties:
        permission_id: { type: string, minLength: 1 }
        methods:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        required: { type: boolean, const: true }
        effects:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [read, write, delete, execute, admin] }
    ExternalPackageMethodRouteSummary:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [capability, worker, core_action] }
        binding_id: { type: string, minLength: 1 }
        target_method: { type: string, minLength: 1 }
        worker_id: { type: string, minLength: 1 }
        action_id: { type: string, minLength: 1 }
    ExternalPackageConfirmationSummary:
      type: object
      required: [mode, request_hash_fields, plan_hash_required]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [none, required, risk_based] }
        preflight_method: { type: string, minLength: 1 }
        request_hash_fields:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        plan_hash_required: { type: boolean }
    ExternalPackageCancelSummary:
      type: object
      required: [cancelable, disable_behavior, uninstall_behavior, ack_timeout_ms]
      additionalProperties: false
      properties:
        cancelable: { type: boolean }
        disable_behavior: { type: string, enum: [cancel, orphan, wait] }
        uninstall_behavior: { type: string, enum: [cancel_then_block_delete, force_cleanup_allowed] }
        ack_timeout_ms: { type: integer, minimum: 0 }
    ExternalPackageMethodSummary:
      type: object
      required: [method, route, effect, execution, dangerous, preflight_only, required_permissions, confirmation]
      additionalProperties: false
      properties:
        method: { type: string, minLength: 1 }
        route: { $ref: "#/components/schemas/ExternalPackageMethodRouteSummary" }
        effect: { type: string, enum: [read, write, delete, execute, admin] }
        execution: { type: string, enum: [sync, operation, subscription] }
        dangerous: { type: boolean }
        preflight_only: { type: boolean }
        required_permissions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        confirmation: { $ref: "#/components/schemas/ExternalPackageConfirmationSummary" }
        cancel: { $ref: "#/components/schemas/ExternalPackageCancelSummary" }
    ExternalPackageCapabilityContractSummary:
      type: object
      required: [binding_id, capability_id, capability_version, contract_sha256]
      additionalProperties: false
      properties:
        binding_id: { type: string, minLength: 1 }
        capability_id: { type: string, minLength: 1 }
        capability_version: { type: string, minLength: 1 }
        contract_sha256: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    ExternalPackageWorkerSummary:
      type: object
      required: [worker_id, artifact, mode, scope, memory_limit_bytes, idle_timeout_ms]
      additionalProperties: false
      properties:
        worker_id: { type: string, minLength: 1 }
        artifact: { type: string, minLength: 1 }
        mode: { const: job }
        scope: { $ref: "#/components/schemas/ResourceScopeKind" }
        memory_limit_bytes: { type: integer, minimum: 1, maximum: 268435456 }
        idle_timeout_ms: { type: integer, minimum: 0 }
    ExternalPackageNetworkMethodAccessSummary:
      type: object
      required: [method, operations, http_methods]
      additionalProperties: false
      properties:
        method: { type: string, minLength: 1 }
        operations:
          type: array
          uniqueItems: true
          items: { type: string, enum: [http, http_stream, websocket_round_trip, tcp_round_trip, udp_round_trip] }
        http_methods:
          type: array
          uniqueItems: true
          items: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS] }
    ExternalPackageNetworkSummary:
      type: object
      required: [connector_id, transport, scope, destinations, auth_declared, tls_declared, method_access]
      additionalProperties: false
      properties:
        connector_id: { type: string, minLength: 1 }
        transport: { type: string, enum: [http, websocket, tcp, udp] }
        scope: { $ref: "#/components/schemas/ResourceScopeKind" }
        destinations:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        auth_declared: { type: boolean }
        tls_declared: { type: boolean }
        method_access:
          type: array
          items: { $ref: "#/components/schemas/ExternalPackageNetworkMethodAccessSummary" }
    ExternalPackageStorageMethodAccessSummary:
      type: object
      required: [method, operations]
      additionalProperties: false
      properties:
        method: { type: string, minLength: 1 }
        operations:
          type: array
          uniqueItems: true
          items: { type: string, enum: [read, write, delete, list, get, put, query, exec] }
    ExternalPackageStorageSummary:
      type: object
      required: [store_id, kind, scope, quota_bytes, schema_version, method_access]
      additionalProperties: false
      properties:
        store_id: { type: string, minLength: 1 }
        kind: { type: string, enum: [kv, files, sqlite] }
        scope: { $ref: "#/components/schemas/ResourceScopeKind" }
        quota_bytes: { type: integer, minimum: 1, maximum: 1073741824 }
        quota_files: { type: integer, minimum: 1, maximum: 100000 }
        schema_version: { type: integer, minimum: 1 }
        method_access:
          type: array
          items: { $ref: "#/components/schemas/ExternalPackageStorageMethodAccessSummary" }
    ExternalPackageSecretRefSummary:
      type: object
      required: [setting_key, secret_ref, scope]
      additionalProperties: false
      properties:
        setting_key: { type: string, minLength: 1 }
        secret_ref: { type: string, minLength: 1 }
        scope: { $ref: "#/components/schemas/ResourceScopeKind" }
    ExternalPackageCoreActionSummary:
      type: object
      required: [method, action_id, effect]
      additionalProperties: false
      properties:
        method: { type: string, minLength: 1 }
        action_id: { type: string, minLength: 1 }
        effect: { type: string, enum: [read, write, delete, execute, admin] }
    ExternalPackageIntentSummary:
      type: object
      required: [intent_id, method]
      additionalProperties: false
      properties:
        intent_id: { type: string, minLength: 1 }
        method: { type: string, minLength: 1 }
    ExternalPackageSurfaceSummary:
      type: object
      required: [surface_id, kind, intent, label, entry]
      additionalProperties: false
      properties:
        surface_id: { type: string, minLength: 1 }
        kind: { type: string, enum: [view, command, background] }
        intent: { type: string, enum: [primary, secondary, utility] }
        label: { type: string, minLength: 1 }
        entry: { type: string, minLength: 1 }
        icon: { type: string, minLength: 1 }
        default_size: { $ref: "#/components/schemas/ExternalPackageSizeSummary" }
    ExternalPackageSizeSummary:
      type: object
      required: [width, height]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    ExternalPackageSecuritySummary:
      type: object
      description: Closed, display-ready projection of every security-relevant declaration in the inspected manifest.
      required: [summary_sha256, permissions, methods, capability_contracts, workers, network, storage, secret_refs, core_actions, intents, surfaces]
      additionalProperties: false
      properties:
        summary_sha256: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/ExternalPackagePermissionSummary" }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ExternalPackageMethodSummary" }
        capability_contracts:
          type: array
