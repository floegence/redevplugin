        plugin_instance_id: { type: string, minLength: 1 }
        surface_instance_id: { type: string, minLength: 1 }
        bridge_channel_id: { type: string, minLength: 1 }
        plugin_gateway_token: { type: string, minLength: 1 }
        confirmation_id: { type: string }
        method: { type: string, minLength: 1 }
        params:
          type: object
          additionalProperties: true
    PrepareMethodConfirmationRequest:
      type: object
      required: [plugin_instance_id, surface_instance_id, bridge_channel_id, plugin_gateway_token, method]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        surface_instance_id: { type: string, minLength: 1 }
        bridge_channel_id: { type: string, minLength: 1 }
        plugin_gateway_token: { type: string, minLength: 1 }
        method: { type: string, minLength: 1 }
        params:
          type: object
          additionalProperties: true
    RPCResult:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            data: true
          not:
            anyOf:
              - required: [execution_id]
              - required: [confirmation_required]
        - type: object
          additionalProperties: false
          required: [execution_id]
          properties:
            data: true
            execution_id: { type: string, minLength: 1 }
        - type: object
          additionalProperties: false
          required: [confirmation_required, confirmation_token_id, request_hash, plan_hash]
          properties:
            confirmation_required: { const: true }
            confirmation_token_id: { type: string, minLength: 1 }
            request_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            plan_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    RiskFlag:
      type: object
      required: [id, severity, summary]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: Stable machine-readable risk identifier.
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        summary: { type: string, minLength: 1 }
        description: { type: string }
        requires_confirmation: { type: boolean }
        requires_admin: { type: boolean }
        data_loss_risk: { type: boolean }
        destructive: { type: boolean }
    RiskPlan:
      type: object
      required: [schema_version, summary, risk_flags]
      additionalProperties: false
      properties:
        schema_version: { const: redevplugin.capability.risk_plan.v1 }
        capability_id: { type: string }
        binding_id: { type: string }
        method: { type: string }
        target_method: { type: string }
        action: { type: string }
        effect:
          type: string
          enum: [read, write, execute, delete, admin]
        resource_ref: { type: string }
        resource_display_name: { type: string }
        summary: { type: string, minLength: 1 }
        risk_flags:
          type: array
          items:
            $ref: "#/components/schemas/RiskFlag"
        requires_confirmation: { type: boolean }
        requires_admin: { type: boolean }
        data_loss_risk: { type: boolean }
        destructive: { type: boolean }
        deny_reason: { type: string }
        details:
          type: object
          additionalProperties: true
    PluginMethodConfirmationPreparation:
      type: object
      required: [confirmation_id, confirmation_token_id, request_hash, plan_hash, expires_at]
      additionalProperties: false
      properties:
        confirmation_id: { type: string, minLength: 1 }
        confirmation_token_id:
          type: string
          minLength: 1
          description: Opaque audit/display id for the server-held confirmation token. It is not a credential.
        request_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        plan_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        plan:
          description: Host-redacted confirmation plan payload returned by the declared preflight method, when available.
          oneOf:
            - $ref: "#/components/schemas/RiskPlan"
            - type: object
              additionalProperties: true
              properties:
                schema_version:
                  not:
                    type: string
                    pattern: '^redevplugin\.capability\.risk_plan\.'
        expires_at: { type: string, format: date-time }
    InvokeIntentRequest:
      type: object
      required: [intent_id]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string }
        intent_id: { type: string, minLength: 1 }
        params:
          type: object
          additionalProperties: true
    CancelExecutionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string }
    CapabilityContractPin:
      $ref: "../plugin/host-capability-pin-v1.schema.json"
    Execution:
      type: object
      additionalProperties: false
      required: [execution_id, plugin_instance_id, kind, status, cursor, cancelable, created_at, updated_at]
      properties:
        execution_id: { type: string, minLength: 1 }
        plugin_instance_id: { type: string, minLength: 1 }
        kind: { type: string, enum: [sync, operation, subscription] }
        status: { type: string, enum: [running, cancel_requested, completed, canceled, failed, orphaned] }
        cursor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        failure_code: { type: string, minLength: 1 }
        cancelable: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cancel_requested_at: { type: string, format: date-time }
        terminal_at: { type: string, format: date-time }
    Event:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, kind]
      properties:
        execution_id: { type: string, minLength: 1 }
        sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
        kind: { type: string, enum: [progress, data, diagnostic, terminal] }
        payload:
          type: object
          additionalProperties: true
        error: { $ref: "#/components/schemas/PublicError" }
    PublicError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    StartRuntimeRequest:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        target: { $ref: "#/components/schemas/RuntimeTarget" }
    ExportDataRequest:
      type: object
      required: [plugin_instance_id]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
    DeleteDataExportRequest:
      type: object
      required: [plugin_instance_id, bundle_ref]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        bundle_ref: { type: string, minLength: 1 }
    ImportDataRequest:
      type: object
      required: [plugin_instance_id, bundle_ref, expected_management_revision]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        bundle_ref: { type: string, minLength: 1 }
        expected_management_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
    PluginDataBinding:
      type: object
      required: [plugin_instance_id, generation_id, state, revision, shape_hash]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        generation_id: { type: string, minLength: 1 }
        state: { type: string, enum: [active, retained] }
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        shape_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        retained_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    RetainedDataList:
      type: object
      required: [retained_data]
      additionalProperties: false
      properties:
        retained_data:
          type: array
          items:
            $ref: "#/components/schemas/PluginDataBinding"
    RetainedDataCleanupResult:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted:
          type: array
          items:
            $ref: "#/components/schemas/PluginDataBinding"
    DeleteRetainedDataRequest:
      type: object
      required: [plugin_instance_id, expected_binding_revision]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        expected_binding_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
    CleanupExpiredRetainedDataRequest:
      type: object
      additionalProperties: false
    GrantPermissionRequest:
      type: object
      required: [plugin_instance_id, permission_id, expected_policy_revision, expected_management_revision, expected_revoke_epoch]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        permission_id: { type: string, minLength: 1 }
        expected_policy_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expected_management_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expected_revoke_epoch: { type: integer, minimum: 0, maximum: 9007199254740991 }
        expires_at: { type: string, format: date-time }
    RevokePermissionRequest:
      type: object
      required: [plugin_instance_id, permission_id, expected_policy_revision, expected_management_revision, expected_revoke_epoch]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        permission_id: { type: string, minLength: 1 }
        expected_policy_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expected_management_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expected_revoke_epoch: { type: integer, minimum: 0, maximum: 9007199254740991 }
        reason: { type: string }
    PutSecurityPolicyRequest:
      type: object
      required: [expected_policy_revision, expected_management_revision, expected_revoke_epoch, allowed_permissions, denied_methods]
      additionalProperties: false
      properties:
        expected_policy_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expected_management_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expected_revoke_epoch: { type: integer, minimum: 0, maximum: 9007199254740991 }
        allowed_permissions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        denied_methods:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
    DeleteSecurityPolicyRequest:
      type: object
      required: [expected_policy_revision, expected_management_revision, expected_revoke_epoch]
      additionalProperties: false
      properties:
        expected_policy_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expected_management_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expected_revoke_epoch: { type: integer, minimum: 0, maximum: 9007199254740991 }
    SecretRefRequest:
      type: object
      required: [plugin_instance_id, secret_ref, scope]
      additionalProperties: false
      properties:
        plugin_instance_id: { type: string, minLength: 1 }
        secret_ref: { type: string, minLength: 1 }
        scope: { type: string, enum: [user, environment] }
    ResourceScopeKind:
      type: string
      enum: [user, environment]
    PatchSettingsRequest:
      type: object
      required: [scope, expected_values_revision]
      additionalProperties: false
      minProperties: 3
      properties:
        scope: { $ref: "#/components/schemas/ResourceScopeKind" }
        expected_values_revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        set:
          type: object
          minProperties: 1
          additionalProperties: true
        remove:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
