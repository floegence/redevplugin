openapi: 3.1.0
info:
  title: ReDevPlugin Plugin Platform API
  version: 3.0.5
  description: Host-agnostic plugin management, bridge, execution, data, and sandbox routes. Release-ref install and update routes resolve host-controlled package artifacts server-side and do not accept requested trust_state values; external package URL, GitHub repository, and uploaded-package flows use process-local inspection followed by exact-digest confirmed installation; local-import package install/update routes remain explicit developer/import flows and do not accept caller-supplied trust_state values.
x-redevplugin-query-policy:
  reject_url_query_strings: true
  require_closed_json_bodies: true
  require_exact_origin: true
  csrf:
    get_query: not_required
    post_query: required
    mutation: required
paths:
  /_redevplugin/api/plugins/{plugin_instance_id}/local-import:
    post:
      operationId: importLocalPackage
      x-redevplugin-route-effect: mutation
      parameters:
        - $ref: "#/components/parameters/PluginInstanceID"
      requestBody:
        required: true
        content:
          application/vnd.redevplugin.package+zip:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/PluginRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
    put:
      operationId: updateLocalPackage
      x-redevplugin-route-effect: mutation
      parameters:
        - $ref: "#/components/parameters/PluginInstanceID"
        - name: X-ReDevPlugin-Expected-Management-Revision
          in: header
          required: true
          description: Canonical decimal management revision. Duplicate, combined, empty, or whitespace-padded values are rejected.
          schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
      requestBody:
        required: true
        content:
          application/vnd.redevplugin.package+zip:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/PluginRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/external-packages/inspect:
    post:
      operationId: inspectExternalPackage
      x-redevplugin-route-effect: mutation
      description: Resolves and inspects a package from a caller-selected URL or GitHub repository without installing it. Package identity, hashes, provenance, signature state, approval, and update eligibility are computed by the platform and cannot be supplied by the caller.
      requestBody:
        $ref: "#/components/requestBodies/InspectExternalPackageRequest"
      responses:
        "200": { $ref: "#/components/responses/ExternalPackageInspectionResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/external-packages/upload/inspect:
    post:
      operationId: inspectUploadedExternalPackageInstall
      x-redevplugin-route-effect: mutation
      description: Uploads and inspects a package for installation. Package identity, hashes, provenance, signature state, approval, and update eligibility are computed by the platform and cannot be supplied by the caller. The process-local inspection expires and must be explicitly installed with its exact package digest.
      requestBody:
        required: true
        content:
          application/vnd.redevplugin.package+zip:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/ExternalPackageInspectionResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/{plugin_instance_id}/external-packages/upload/inspect:
    put:
      operationId: inspectUploadedExternalPackageUpdate
      x-redevplugin-route-effect: mutation
      description: Uploads and inspects a package for an optimistic-concurrency-controlled update. Package identity, hashes, provenance, signature state, approval, and update eligibility are computed by the platform and cannot be supplied by the caller. The process-local inspection expires and must be explicitly installed with its exact package digest.
      parameters:
        - $ref: "#/components/parameters/PluginInstanceID"
        - name: X-ReDevPlugin-Expected-Management-Revision
          in: header
          required: true
          description: Canonical decimal management revision. Duplicate, combined, empty, or whitespace-padded values are rejected.
          schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
      requestBody:
        required: true
        content:
          application/vnd.redevplugin.package+zip:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/ExternalPackageInspectionResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/external-packages/install:
    post:
      operationId: installInspectedPackage
      x-redevplugin-route-effect: mutation
      description: Reopens and installs one unexpired process-local inspection after the user confirms its exact package digest. The inspection is bound to the exact authenticated session. Invalid or revoked signatures fail closed; an accepted package is installed enabled, while permission grants remain separate explicit mutations.
      requestBody:
        $ref: "#/components/requestBodies/InstallInspectedPackageRequest"
      responses:
        "200": { $ref: "#/components/responses/InstalledExternalPackageResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/install-release-ref:
    post:
      operationId: installReleaseRef
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/InstallReleaseRefRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/release-packages/inspect:
    post:
      operationId: inspectReleasePackage
      x-redevplugin-route-effect: mutation
      description: Resolves and fully verifies an exact release reference before installation so one user confirmation can review the Host-derived permissions and package identity. The inspection does not install a plugin, and installation re-verifies the exact release and hashes.
      requestBody:
        $ref: "#/components/requestBodies/InspectReleasePackageRequest"
      responses:
        "200": { $ref: "#/components/responses/ReleasePackageInspectionResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/enable:
    post:
      operationId: enablePlugin
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/EnableRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/disable:
    post:
      operationId: disablePlugin
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/DisableRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/uninstall:
    post:
      operationId: uninstallPlugin
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/UninstallRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/update-release-ref:
    post:
      operationId: updateReleaseRef
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/UpdateReleaseRefRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/downgrade:
    post:
      operationId: downgradePlugin
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/DowngradeRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/catalog/query:
    post:
      operationId: listPlugins
      x-redevplugin-route-effect: query
      requestBody:
        $ref: "#/components/requestBodies/EmptyQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginCatalogResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/{plugin_instance_id}/icon/{sha256}:
    get:
      operationId: readInstalledPluginIcon
      x-redevplugin-route-effect: query
      description: Returns the content-addressed presentation icon from the installed package asset store.
      parameters:
        - $ref: "#/components/parameters/PluginInstanceID"
        - $ref: "#/components/parameters/SHA256Digest"
      responses:
        "200":
          description: Verified PNG or WebP icon bytes.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: The immutable digest matches If-None-Match. }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/features/query:
    post:
      operationId: getPluginFeatures
      x-redevplugin-route-effect: query
      requestBody:
        $ref: "#/components/requestBodies/EmptyQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginFeaturesResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/surfaces/open:
    post:
      operationId: openPluginSurface
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/OpenSurfaceRequest"
      responses:
        "200": { $ref: "#/components/responses/SurfaceBootstrapResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/session/revoke-scope:
    post:
      operationId: revokePluginSessionScope
      x-redevplugin-route-effect: mutation
      description: Irreversibly fences the authenticated session, drains every exact-session platform and runtime resource, and returns only public cumulative counts.
      requestBody:
        $ref: "#/components/requestBodies/RevokeSessionScopeRequest"
      responses:
        "200": { $ref: "#/components/responses/SessionScopeRevokeResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/surfaces/{surface_instance_id}/prepare:
    post:
      operationId: preparePluginSurface
      x-redevplugin-route-effect: mutation
      parameters:
        - $ref: "#/components/parameters/SurfaceInstanceID"
      requestBody:
        $ref: "#/components/requestBodies/PrepareSurfaceRequest"
      responses:
        "200": { $ref: "#/components/responses/SurfacePreparationResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/surfaces/{surface_instance_id}/bridge-token:
    post:
      operationId: createSurfaceBridgeToken
      x-redevplugin-route-effect: mutation
      parameters:
        - $ref: "#/components/parameters/SurfaceInstanceID"
      requestBody:
        $ref: "#/components/requestBodies/TrustedParentBridgeTokenRequest"
      responses:
        "200": { $ref: "#/components/responses/BridgeTokenResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/surfaces/{surface_instance_id}/assets/read:
    post:
      operationId: readPreparedSurfaceAsset
      x-redevplugin-route-effect: query
      parameters:
        - $ref: "#/components/parameters/SurfaceInstanceID"
      requestBody:
        $ref: "#/components/requestBodies/ReadSurfaceAssetRequest"
      responses:
        "200": { $ref: "#/components/responses/SurfaceAssetResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/surfaces/{surface_instance_id}/confirmations/reject:
    post:
      operationId: rejectSurfacePluginConfirmation
      x-redevplugin-route-effect: mutation
      description: Atomically rejects a pending confirmation only when it belongs to the authenticated surface, session, current plugin revision, and private bridge channel.
      parameters:
        - $ref: "#/components/parameters/SurfaceInstanceID"
      requestBody:
        $ref: "#/components/requestBodies/RejectSurfaceConfirmationRequest"
      responses:
        "200": { $ref: "#/components/responses/ConfirmationRejectionResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/surfaces/{surface_instance_id}/dispose:
    post:
      operationId: disposePluginSurface
      x-redevplugin-route-effect: mutation
      description: Atomically observes and revokes one exact authenticated surface. An active surface becomes closed, a retained closure confirms closed, and an absent result is authoritative inactivity; transport failures remain an unknown mutation outcome.
      parameters:
        - $ref: "#/components/parameters/SurfaceInstanceID"
      requestBody:
        $ref: "#/components/requestBodies/DisposeSurfaceRequest"
      responses:
        "200": { $ref: "#/components/responses/SurfaceDisposeResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/rpc:
    post:
      operationId: callPluginMethod
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/RPCRequest"
      responses:
        "200": { $ref: "#/components/responses/RPCResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/confirmations/prepare:
    post:
      operationId: preparePluginMethodConfirmation
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/PrepareMethodConfirmationRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginMethodConfirmationPreparationResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/intents/query:
    post:
      operationId: listPluginIntents
      x-redevplugin-route-effect: query
      description: 'Lists enabled, runnable plugin intents available to host-mediated interop. The response data is `{ "intents": [...] }`.'
      requestBody:
        $ref: "#/components/requestBodies/ListIntentsQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/IntentListResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/intents/invoke:
    post:
      operationId: invokePluginIntent
      x-redevplugin-route-effect: mutation
      description: Invokes a host-mediated plugin intent without iframe gateway tokens while preserving local policy, permission grants, and dangerous-method fail-closed checks.
      requestBody:
        $ref: "#/components/requestBodies/InvokeIntentRequest"
      responses:
        "200": { $ref: "#/components/responses/RPCResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/executions/query:
    post:
      operationId: listPluginExecutions
      x-redevplugin-route-effect: query
      requestBody:
        $ref: "#/components/requestBodies/ListExecutionsRequest"
      responses:
        "200": { $ref: "#/components/responses/ExecutionListResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/executions/release-installs:
    post:
      operationId: startReleaseInstallExecution
      x-redevplugin-route-effect: mutation
      description: Starts or idempotently recovers an owner-bound release installation and returns only its unified Execution identity.
      requestBody:
        $ref: "#/components/requestBodies/StartReleaseInstallExecutionRequest"
      responses:
        "200": { $ref: "#/components/responses/ExecutionResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/executions/{execution_id}/query:
    post:
      operationId: getPluginExecution
      x-redevplugin-route-effect: query
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      requestBody:
        $ref: "#/components/requestBodies/EmptyQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/ExecutionResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/executions/{execution_id}/cancel:
    post:
      operationId: cancelPluginExecution
      x-redevplugin-route-effect: mutation
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      requestBody:
        $ref: "#/components/requestBodies/CancelExecutionRequest"
      responses:
        "200": { $ref: "#/components/responses/ExecutionResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/executions/{execution_id}/events/query:
    post:
      operationId: listPluginExecutionEvents
      x-redevplugin-route-effect: query
      description: Returns the single ordered event envelope after the caller's last observed execution cursor. Session and surface authorization remain Host-owned transport concerns.
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      requestBody:
        $ref: "#/components/requestBodies/ListExecutionEventsRequest"
      responses:
        "200": { $ref: "#/components/responses/ExecutionEventListResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/runtime/start:
    post:
      operationId: startPluginRuntime
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/StartRuntimeRequest"
      responses:
        "200": { $ref: "#/components/responses/RuntimeHealthResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/runtime/stop:
    post:
      operationId: stopPluginRuntime
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/EmptyRequest"
      responses:
        "200": { $ref: "#/components/responses/RuntimeStopResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/runtime/recover-enabled:
    post:
      operationId: recoverEnabledPlugins
      x-redevplugin-route-effect: mutation
      description: Returns the Host-owned idempotent recovery snapshot for this startup revision. Repeated calls do not schedule a second recovery pass.
      requestBody:
        $ref: "#/components/requestBodies/EmptyRequest"
      responses:
        "200": { $ref: "#/components/responses/RecoverySnapshotResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/runtime/recover/retry:
    post:
      operationId: retryPluginRecovery
      x-redevplugin-route-effect: mutation
      description: Retries recovery for one plugin after an explicit user action and updates the Host-owned snapshot.
      requestBody:
        $ref: "#/components/requestBodies/RetryPluginRecoveryRequest"
      responses:
        "200": { $ref: "#/components/responses/PluginRecoveryResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/runtime/health/query:
    post:
      operationId: getPluginRuntimeHealth
      x-redevplugin-route-effect: query
      requestBody:
        $ref: "#/components/requestBodies/EmptyQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/RuntimeHealthResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/data/export:
    post:
      operationId: exportPluginData
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/ExportDataRequest"
      responses:
        "200": { $ref: "#/components/responses/DataExportResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/data/export/delete:
    post:
      operationId: deletePluginDataExport
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/DeleteDataExportRequest"
      responses:
        "200": { $ref: "#/components/responses/DataExportDeleteResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/data/import:
    post:
      operationId: importPluginData
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/ImportDataRequest"
      responses:
        "200": { $ref: "#/components/responses/DataImportResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/retained-data/query:
    post:
      operationId: listPluginRetainedData
      x-redevplugin-route-effect: query
      requestBody:
        $ref: "#/components/requestBodies/ListRetainedDataQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/RetainedDataListResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/retained-data/delete:
    post:
      operationId: deletePluginRetainedData
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/DeleteRetainedDataRequest"
      responses:
        "200": { $ref: "#/components/responses/RetainedDataBindingResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/retained-data/cleanup-expired:
    post:
      operationId: cleanupExpiredPluginRetainedData
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/CleanupExpiredRetainedDataRequest"
      responses:
        "200": { $ref: "#/components/responses/RetainedDataCleanupResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/permissions/query:
    post:
      operationId: listPluginPermissionGrants
      x-redevplugin-route-effect: query
      requestBody:
        $ref: "#/components/requestBodies/ListPermissionsQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/PermissionListResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/permissions/requirements/query:
    post:
      operationId: getPluginPermissionRequirements
      x-redevplugin-route-effect: query
      description: Projects required permissions only from the active plugin version's Host-verified capability contracts.
      requestBody:
        $ref: "#/components/requestBodies/PermissionRequirementsQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/PermissionRequirementsResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/permissions/grant:
    post:
      operationId: grantPluginPermission
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/GrantPermissionRequest"
      responses:
        "200": { $ref: "#/components/responses/PermissionMutationResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/permissions/revoke:
    post:
      operationId: revokePluginPermission
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/RevokePermissionRequest"
      responses:
        "200": { $ref: "#/components/responses/PermissionMutationResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/security-policies/query:
    post:
      operationId: listPluginSecurityPolicies
      x-redevplugin-route-effect: query
      requestBody:
        $ref: "#/components/requestBodies/EmptyQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/SecurityPolicyListResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/security-policies/{plugin_instance_id}/query:
    post:
      operationId: getPluginSecurityPolicy
      x-redevplugin-route-effect: query
      parameters:
        - $ref: "#/components/parameters/PluginInstanceID"
      requestBody:
        $ref: "#/components/requestBodies/EmptyQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/SecurityPolicyRecordResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/security-policies/{plugin_instance_id}:
    put:
      operationId: putPluginSecurityPolicy
      x-redevplugin-route-effect: mutation
      parameters:
        - $ref: "#/components/parameters/PluginInstanceID"
      requestBody:
        $ref: "#/components/requestBodies/PutSecurityPolicyRequest"
      responses:
        "200": { $ref: "#/components/responses/SecurityPolicyRecordResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
    delete:
      operationId: deletePluginSecurityPolicy
      x-redevplugin-route-effect: mutation
      parameters:
        - $ref: "#/components/parameters/PluginInstanceID"
      requestBody:
        $ref: "#/components/requestBodies/DeleteSecurityPolicyRequest"
      responses:
        "200": { $ref: "#/components/responses/SecurityPolicyDeleteResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/diagnostics/query:
    post:
      operationId: listPluginDiagnosticEvents
      x-redevplugin-route-effect: query
      requestBody:
        $ref: "#/components/requestBodies/ListDiagnosticsQueryRequest"
      responses:
        "200": { $ref: "#/components/responses/DiagnosticEventListResponse" }
        default: { $ref: "#/components/responses/PlatformErrorResponse" }
  /_redevplugin/api/plugins/secrets/bind:
    post:
      operationId: bindPluginSecret
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/SecretRefRequest"
      responses:
        "200": { $ref: "#/components/responses/SecretBindResponse" }
        default: { $ref: "#/components/responses/MutationPlatformErrorResponse" }
  /_redevplugin/api/plugins/secrets/test:
    post:
      operationId: testPluginSecret
      x-redevplugin-route-effect: mutation
      requestBody:
        $ref: "#/components/requestBodies/SecretRefRequest"
      responses:
