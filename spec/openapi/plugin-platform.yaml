      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExecutionSuccessResponse"
    ExecutionListResponse:
      description: Host-owned execution records.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExecutionListSuccessResponse"
