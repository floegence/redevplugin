[workspace]
resolver = "2"
members = [
  "crates/redevplugin-runtime",
  "crates/redevplugin-worker-sdk",
  "internal/scaffoldworker",
  "internal/runtimeworkloadworker",
  "internal/selectedfileworker",
  "internal/networkworker",
  "internal/dataupgradeworker",
  "internal/intervalworker",
  "examples/workers/memos",
  "examples/workers/weather",
  "examples/workers/sky-strike",
]

[workspace.package]
version = "3.24.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/floegence/redevplugin"
rust-version = "1.98.0"
