name: Recover Partial Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Failed immutable release tag, for example v0.6.5
        required: true
        type: string
      release_run_id:
        description: Original failed Release workflow run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: redevplugin-release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify Failed Release Identity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      source-commit: ${{ steps.verify.outputs.source-commit }}
      package-artifact-id: ${{ steps.verify.outputs.package-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind tag, original run, and package artifact
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]

          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          source_commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          git merge-base --is-ancestor "$source_commit" origin/main
          version=${TAG#v}

          run_json=$(mktemp "${RUNNER_TEMP}/redevplugin-release-run.XXXXXX")
          artifacts_json=$(mktemp "${RUNNER_TEMP}/redevplugin-release-artifacts.XXXXXX")
          trap 'rm -f "$run_json" "$artifacts_json"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" > "$run_json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts?per_page=100" \
            --slurp > "$artifacts_json"

          package_artifact=$(python3 - "$run_json" "$artifacts_json" "$GITHUB_REPOSITORY" "$TAG" "$source_commit" "$RELEASE_RUN_ID" <<'PY'
          import json
          import pathlib
          import re
          import sys

          run_path, artifacts_path, repository, tag, source_commit, run_id = sys.argv[1:]
          run = json.loads(pathlib.Path(run_path).read_text(encoding="utf-8"))
          expected_run = {
              "event": "push",
              "path": ".github/workflows/release.yml",
              "head_sha": source_commit,
              "head_branch": tag,
              "status": "completed",
              "conclusion": "failure",
          }
          for field, expected in expected_run.items():
              if run.get(field) != expected:
                  raise SystemExit(f"original release run {field} mismatch")
          if str(run.get("id")) != run_id:
              raise SystemExit("original release run ID mismatch")
          if run.get("repository", {}).get("full_name") != repository:
              raise SystemExit("original release run repository mismatch")
          if run.get("head_repository", {}).get("full_name") != repository:
              raise SystemExit("original release run head repository mismatch")

          pages = json.loads(pathlib.Path(artifacts_path).read_text(encoding="utf-8"))
          artifacts = [artifact for page in pages for artifact in page.get("artifacts", [])]
          expected_name = f"platform-packages-{source_commit}"
          matches = [artifact for artifact in artifacts if artifact.get("name") == expected_name]
          if len(matches) != 1:
              raise SystemExit("original release must have exactly one platform package artifact")
          artifact = matches[0]
          workflow_run = artifact.get("workflow_run", {})
          if artifact.get("expired") is not False or not isinstance(artifact.get("id"), int):
              raise SystemExit("original platform package artifact is unavailable")
          if str(workflow_run.get("id")) != run_id or workflow_run.get("head_sha") != source_commit:
              raise SystemExit("platform package artifact workflow identity mismatch")
          if workflow_run.get("head_branch") != tag:
              raise SystemExit("platform package artifact tag mismatch")
          digest = artifact.get("digest")
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("original platform package artifact digest is invalid")
          print(artifact["id"])
          PY
          )
          package_artifact_id=$package_artifact

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source-commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "package-artifact-id=$package_artifact_id" >> "$GITHUB_OUTPUT"

  release-admission:
    name: Admit GitHub Release Transaction
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Reject a non-reconcilable exact-tag Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source-commit }}
          TAG: ${{ inputs.tag }}
          ALLOW_PUBLIC: "true"
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$ALLOW_PUBLIC" = true || test "$ALLOW_PUBLIC" = false
          pages=$(mktemp "${RUNNER_TEMP}/redevplugin-release-pages.XXXXXX")
          release=$(mktemp "${RUNNER_TEMP}/redevplugin-release.XXXXXX")
          assets=$(mktemp "${RUNNER_TEMP}/redevplugin-release-assets.XXXXXX")
          trap 'rm -f "$pages" "$release" "$assets"' EXIT
          marker="<!-- redevplugin-release-transaction-v1 source_commit=${SOURCE_COMMIT} -->"

          load_pages() {
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$pages" || return 1
            jq -e 'type == "array" and all(.[]; type == "array" and length <= 100)' "$pages" > /dev/null
          }

          validate_empty_bound_draft() {
            local release_id=$1
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$release" || return 1
            jq -e --argjson id "$release_id" --arg tag "$TAG" --arg marker "$marker" '
              .id == $id and
              .tag_name == $tag and
              .prerelease == false and
              .draft == true and
              ((.body // "") | contains($marker))
            ' "$release" > /dev/null || return 1
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$assets" || return 1
            jq -e 'type == "array" and length == 0' "$assets" > /dev/null
          }

          validate_asset_bound_draft() {
            local release_id=$1
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$release" || return 1
            jq -e --argjson id "$release_id" --arg tag "$TAG" --arg marker "$marker" '
              .id == $id and
              .tag_name == $tag and
              .prerelease == false and
              .draft == true and
              ((.body // "") | contains($marker))
            ' "$release" > /dev/null || return 1
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$assets" || return 1
            jq -e 'type == "array" and length > 0 and length < 100' "$assets" > /dev/null
          }

          normalize_duplicate_releases() {
            local asset_draft_id canonical_id current_id current_ids duplicate_id public_id
            current_ids=$(jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | .id] | sort | .[]' "$pages") || return 1
            asset_draft_id=
            public_id=
            for current_id in $current_ids; do
              [[ "$current_id" =~ ^[1-9][0-9]*$ ]] || return 1
              gh api "repos/${GITHUB_REPOSITORY}/releases/${current_id}" > "$release" || return 1
              jq -e --argjson id "$current_id" --arg tag "$TAG" --arg marker "$marker" '
                .id == $id and
                .tag_name == $tag and
                .prerelease == false and
                (.draft | type == "boolean") and
                ((.body // "") | contains($marker))
              ' "$release" > /dev/null || return 1
              if test "$(jq -r .draft "$release")" = false; then
                test "$ALLOW_PUBLIC" = true || return 1
                test -z "$public_id" || return 1
                public_id=$current_id
              else
                gh api "repos/${GITHUB_REPOSITORY}/releases/${current_id}/assets?per_page=100" > "$assets" || return 1
                jq -e 'type == "array" and length < 100' "$assets" > /dev/null || return 1
                if test "$(jq length "$assets")" != 0; then
                  test -z "$asset_draft_id" || return 1
                  asset_draft_id=$current_id
                fi
              fi
            done
            test -z "$public_id" || test -z "$asset_draft_id" || return 1
            canonical_id=${public_id:-${asset_draft_id:-$(printf '%s\n' "$current_ids" | head -n 1)}}
            [[ "$canonical_id" =~ ^[1-9][0-9]*$ ]] || return 1
            for duplicate_id in $current_ids; do
              test "$duplicate_id" != "$canonical_id" || continue
              for attempt in 1 2 3 4; do
                load_pages || return 1
                if ! jq -e --arg tag "$TAG" --argjson id "$duplicate_id" \
                  'any(.[][]; .tag_name == $tag and .id == $id)' "$pages" > /dev/null; then
                  break
                fi
                current_ids=$(jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | .id] | sort | .[]' "$pages") || return 1
                printf '%s\n' "$current_ids" | grep -Fx "$canonical_id" > /dev/null || return 1
                for current_id in $current_ids; do
                  if test "$current_id" = "$canonical_id" && test -n "$public_id"; then
                    gh api "repos/${GITHUB_REPOSITORY}/releases/${current_id}" > "$release" || return 1
                    jq -e --argjson id "$current_id" --arg tag "$TAG" --arg marker "$marker" '
                      .id == $id and
                      .tag_name == $tag and
                      .prerelease == false and
                      .draft == false and
                      ((.body // "") | contains($marker))
                    ' "$release" > /dev/null || return 1
                  elif test "$current_id" = "$canonical_id" && test -n "$asset_draft_id"; then
                    validate_asset_bound_draft "$current_id" || return 1
                  else
                    validate_empty_bound_draft "$current_id" || return 1
                  fi
                done
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/${duplicate_id}" > /dev/null || true
                load_pages || return 1
                if ! jq -e --arg tag "$TAG" --argjson id "$duplicate_id" \
                  'any(.[][]; .tag_name == $tag and .id == $id)' "$pages" > /dev/null; then
                  break
                fi
                test "$attempt" != 4 || return 1
                sleep "$attempt"
              done
            done
            load_pages || return 1
            test "$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$pages")" = 1
            test "$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .id' "$pages")" = "$canonical_id"
          }

          load_pages
          match_count=$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$pages")
          case "$match_count" in
            0) exit 0 ;;
            1) ;;
            *) normalize_duplicate_releases || {
                 echo "release admission found non-reconcilable exact-tag duplicates" >&2
                 exit 1
               } ;;
          esac
          release_id=$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .id' "$pages")
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$release"
          jq -e --argjson id "$release_id" --arg tag "$TAG" --arg marker "$marker" '
            .id == $id and
            .tag_name == $tag and
            .prerelease == false and
            (.draft | type == "boolean") and
            ((.body // "") | contains($marker))
          ' "$release" > /dev/null || {
            echo "existing release is not an exact reconciliation candidate" >&2
            exit 1
          }
          if test "$(jq -r .draft "$release")" = false && test "$ALLOW_PUBLIC" != true; then
            echo "normal release admission refuses an existing public Release" >&2
            exit 1
          fi

  publish-rust:
    name: Publish Original Rust Source Crates
    needs:
      - preflight
      - release-admission
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.package-artifact-id }}
          path: dist/platform-packages
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"
      - name: Verify immutable package artifact
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source-commit }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 - "$VERSION" "$SOURCE_COMMIT" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat
          import sys
          import tarfile
          import tomllib

          version, source_commit = sys.argv[1:]
          root = pathlib.Path("dist/platform-packages").resolve()

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate JSON field {key}")
                  result[key] = value
              return result

          def load_json_bytes(raw, label, maximum):
              if not raw or len(raw) > maximum:
                  raise SystemExit(f"{label} exceeds its closed size limit")
              try:
                  return json.loads(raw.decode("utf-8"), object_pairs_hook=reject_duplicate_keys)
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise SystemExit(f"{label} is invalid: {error}") from error

          def load_json(path, label, maximum):
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or path.is_symlink():
                  raise SystemExit(f"{label} must be a regular file")
              return load_json_bytes(path.read_bytes(), label, maximum)

          def exact_keys(value, expected, label):
              if not isinstance(value, dict) or set(value) != set(expected):
                  raise SystemExit(f"{label} fields are invalid")

          def safe_file(relative_path, expected_size, expected_sha256):
              if not isinstance(relative_path, str) or "\\" in relative_path:
                  raise SystemExit("package artifact path is invalid")
              path = (root / relative_path).resolve()
              try:
                  path.relative_to(root)
              except ValueError as error:
                  raise SystemExit("package artifact escapes its download root") from error
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or path.is_symlink() or info.st_size != expected_size:
                  raise SystemExit("package artifact is not the declared regular file")
              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_sha256:
                  raise SystemExit("package artifact digest mismatch")
              return path, raw

          def normalized_requirement(requirement):
              if re.fullmatch(r"[0-9]+(?:\.[0-9]+)*(?:-[0-9A-Za-z.-]+)?", requirement):
                  return f"^{requirement}"
              return requirement

          def manifest_dependencies(cargo_manifest):
              result = []

              def append_table(table, kind, target):
                  if table is None:
                      return
                  if not isinstance(table, dict):
                      raise SystemExit("packaged Cargo dependency table is invalid")
                  for declared_name, specification in table.items():
                      if isinstance(specification, str):
                          specification = {"version": specification}
                      if not isinstance(specification, dict) or "version" not in specification:
                          raise SystemExit("packaged Cargo dependency is invalid")
                      if any(key in specification for key in ("path", "git", "registry")):
                          raise SystemExit("packaged Cargo dependency uses a forbidden source")
                      package_name = specification.get("package", declared_name)
                      explicit_name = declared_name if "package" in specification else None
                      result.append({
                          "name": package_name,
                          "version_req": normalized_requirement(specification["version"]),
                          "features": sorted(specification.get("features", [])),
                          "optional": specification.get("optional", False),
                          "default_features": specification.get("default-features", True),
                          "target": target,
                          "kind": kind,
                          "registry": None,
                          "explicit_name_in_toml": explicit_name,
                      })

              append_table(cargo_manifest.get("dependencies"), "normal", None)
              append_table(cargo_manifest.get("dev-dependencies"), "dev", None)
              append_table(cargo_manifest.get("build-dependencies"), "build", None)
              for target, target_manifest in cargo_manifest.get("target", {}).items():
                  append_table(target_manifest.get("dependencies"), "normal", target)
                  append_table(target_manifest.get("dev-dependencies"), "dev", target)
                  append_table(target_manifest.get("build-dependencies"), "build", target)
              return sorted(result, key=lambda value: json.dumps(value, sort_keys=True, separators=(",", ":")))

          manifest_path = root / "platform-package-build-v1.json"
          manifest = load_json(manifest_path, "package build manifest", 256 * 1024)
          exact_keys(manifest, ["schema_version", "platform_version", "source_commit", "contract_set_sha256", "artifacts"], "package build manifest")
          if manifest["schema_version"] != "redevplugin.platform_package_build.v1" or manifest["source_commit"] != source_commit:
              raise SystemExit("package artifact source identity mismatch")
          if manifest["platform_version"] != version or not re.fullmatch(r"[0-9a-f]{64}", manifest["contract_set_sha256"]):
              raise SystemExit("package artifact platform identity mismatch")
          expected_npm = {
              "@floegence/redevplugin-contracts",
              "@floegence/redevplugin-ui",
          }
          expected_rust = {
              "redevplugin-contracts",
              "redevplugin-ipc",
              "redevplugin-runtime",
              "redevplugin-wasm-abi",
              "redevplugin-worker-sdk",
          }
          if not isinstance(manifest["artifacts"], list) or len(manifest["artifacts"]) != len(expected_npm) + len(expected_rust):
              raise SystemExit("package artifact manifest is incomplete")
          expected_paths = {
              **{("npm", name): f"npm/{name.removeprefix('@').replace('/', '-')}-{version}.tgz" for name in expected_npm},
              **{("rust", name): f"rust/{name}-{version}.crate" for name in expected_rust},
          }
          seen = set()
          artifact_keys = []
          cargo_packages = {}
          for artifact in manifest["artifacts"]:
              kind = artifact.get("kind") if isinstance(artifact, dict) else None
              exact_keys(artifact, ["kind", "name", "version", "path", "size", "sha256", "integrity", "sha512"] if kind == "npm" else ["kind", "name", "version", "path", "size", "sha256"], "package artifact")
              name = artifact["name"]
              key = (kind, name)
              if key in seen or key not in expected_paths or artifact["version"] != version or artifact["path"] != expected_paths[key]:
                  raise SystemExit("unexpected package artifact coordinate")
              if not isinstance(artifact["size"], int) or artifact["size"] < 1 or artifact["size"] > 32 * 1024 * 1024 or not re.fullmatch(r"[0-9a-f]{64}", artifact["sha256"]):
                  raise SystemExit("package artifact integrity fields are invalid")
              seen.add(key)
              artifact_keys.append(f"{kind}:{name}")
              path, raw = safe_file(artifact["path"], artifact["size"], artifact["sha256"])
              if kind == "npm":
                  sha512 = hashlib.sha512(raw).hexdigest()
                  integrity = "sha512-" + base64.b64encode(bytes.fromhex(sha512)).decode("ascii")
                  if artifact["sha512"] != sha512 or artifact["integrity"] != integrity:
                      raise SystemExit("npm package integrity mismatch")
                  continue

              archive_root = f"{name}-{version}"
              with tarfile.open(path, mode="r:gz") as archive:
                  members = archive.getmembers()
                  if not members or len(members) > 4096:
                      raise SystemExit("Rust package archive entry count is invalid")
                  member_names = set()
                  total_size = 0
                  for member in members:
                      relative = pathlib.PurePosixPath(member.name)
                      if member.name in member_names or relative.is_absolute() or ".." in relative.parts or relative.parts[0] != archive_root:
                          raise SystemExit("Rust package archive path is invalid")
                      member_names.add(member.name)
                      if not (member.isfile() or member.isdir()) or member.size < 0 or member.size > 8 * 1024 * 1024:
                          raise SystemExit("Rust package archive member is invalid")
                      total_size += member.size
                  if total_size > 32 * 1024 * 1024:
                      raise SystemExit("Rust package archive is too large")
                  cargo_member = archive.getmember(f"{archive_root}/Cargo.toml")
                  vcs_member = archive.getmember(f"{archive_root}/.cargo_vcs_info.json")
                  readme_member = archive.getmember(f"{archive_root}/README.md")
                  cargo_raw = archive.extractfile(cargo_member).read()
                  vcs = load_json_bytes(archive.extractfile(vcs_member).read(), "Cargo VCS info", 64 * 1024)
                  readme = archive.extractfile(readme_member).read().decode("utf-8")
              exact_keys(vcs, ["git", "path_in_vcs"], "Cargo VCS info")
              exact_keys(vcs["git"], ["sha1"], "Cargo VCS git info")
              if vcs["git"] != {"sha1": source_commit} or vcs["path_in_vcs"] != f"crates/{name}":
                  raise SystemExit("Cargo VCS source identity mismatch")
              try:
                  cargo = tomllib.loads(cargo_raw.decode("utf-8"))
              except (UnicodeDecodeError, tomllib.TOMLDecodeError) as error:
                  raise SystemExit(f"packaged Cargo manifest is invalid: {error}") from error
              if "patch" in cargo or "replace" in cargo:
                  raise SystemExit("packaged Cargo manifest contains source replacement")
              package = cargo.get("package", {})
              if package.get("name") != name or package.get("version") != version:
                  raise SystemExit("packaged Cargo identity mismatch")
              cargo_packages[name] = (package, cargo, readme)
          if seen != set(expected_paths) or artifact_keys != sorted(artifact_keys):
              raise SystemExit("package artifact set or ordering is invalid")

          metadata = root / "rust" / "rust-publish-metadata-v1.json"
          metadata = load_json(metadata, "Rust publication metadata", 128 * 1024)
          exact_keys(metadata, ["schema_version", "source_commit", "packages"], "Rust publication metadata")
          if metadata["schema_version"] != "redevplugin.rust_publish_metadata.v1" or metadata["source_commit"] != source_commit:
              raise SystemExit("Rust publication metadata identity mismatch")
          if (not isinstance(metadata["packages"], list) or
                  len(metadata["packages"]) != len(expected_rust) or
                  {item.get("name") for item in metadata["packages"]} != expected_rust):
              raise SystemExit("Rust publication metadata package set mismatch")
          package_fields = ["name", "vers", "deps", "features", "authors", "description", "documentation", "homepage", "readme", "readme_file", "keywords", "categories", "license", "license_file", "repository", "badges", "links", "rust_version"]
          dependency_fields = ["name", "version_req", "features", "optional", "default_features", "target", "kind", "registry", "explicit_name_in_toml"]
          for item in metadata["packages"]:
              exact_keys(item, package_fields, "Rust publication package")
              name = item["name"]
              package, cargo, readme = cargo_packages[name]
              expected_values = {
                  "vers": version,
                  "features": cargo.get("features", {}),
                  "authors": package.get("authors", []),
                  "description": package.get("description"),
                  "documentation": package.get("documentation"),
                  "homepage": package.get("homepage"),
                  "readme": readme,
                  "readme_file": package.get("readme"),
                  "keywords": package.get("keywords", []),
                  "categories": package.get("categories", []),
                  "license": package.get("license"),
                  "license_file": package.get("license-file"),
                  "repository": package.get("repository"),
                  "badges": {},
                  "links": package.get("links"),
                  "rust_version": package.get("rust-version"),
              }
              if any(item[field] != value for field, value in expected_values.items()):
                  raise SystemExit(f"Rust publication package metadata mismatch for {name}")
              if not isinstance(item["deps"], list):
                  raise SystemExit("Rust publication dependency list is invalid")
              for dependency in item["deps"]:
                  exact_keys(dependency, dependency_fields, "Rust publication dependency")
              actual_dependencies = sorted(item["deps"], key=lambda value: json.dumps(value, sort_keys=True, separators=(",", ":")))
              if actual_dependencies != manifest_dependencies(cargo):
                  raise SystemExit(f"Rust publication dependency metadata mismatch for {name}")
          print("verified immutable Rust package bytes")
          PY
      - uses: rust-lang/crates-io-auth-action@275b31c2bd0ae2dc5fc5b03747ab8c88d6e3b1c6 # main
        id: crates-auth
      - name: Publish or reconcile exact crate graph
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source-commit }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import struct
          import time
          import urllib.error
          import urllib.request

          root = pathlib.Path("dist/platform-packages").resolve()
          version = os.environ["VERSION"]
          token = os.environ["CARGO_REGISTRY_TOKEN"]
          manifest = json.loads((root / "platform-package-build-v1.json").read_text())
          metadata = json.loads((root / "rust" / "rust-publish-metadata-v1.json").read_text())
          order = ["redevplugin-contracts", "redevplugin-wasm-abi", "redevplugin-worker-sdk", "redevplugin-ipc", "redevplugin-runtime"]
          packages = {item["name"]: item for item in metadata["packages"]}
          artifacts = {item["name"]: item for item in manifest["artifacts"] if item["kind"] == "rust"}
          if set(packages) != set(order) or set(artifacts) != set(order) or metadata["source_commit"] != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("Rust package closure mismatch")

          def remote_checksum(name):
              request = urllib.request.Request(f"https://crates.io/api/v1/crates/{name}/{version}", headers={"Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)["version"]["checksum"]
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  if error.code == 429 or error.code >= 500:
                      return "retry"
                  raise

          for name in order:
              artifact = artifacts[name]
              crate_bytes = (root / artifact["path"]).read_bytes()
              expected = artifact["sha256"]
              if hashlib.sha256(crate_bytes).hexdigest() != expected or packages[name]["vers"] != version:
                  raise SystemExit(f"{name} immutable package mismatch")
              submitted = False
              for attempt in range(20):
                  remote = remote_checksum(name)
                  if remote == expected:
                      break
                  if remote == "retry":
                      time.sleep(6)
                      continue
                  if remote is not None:
                      raise SystemExit(f"{name}@{version} exists with different bytes")
                  if submitted:
                      time.sleep(6)
                      continue
                  metadata_bytes = json.dumps(packages[name], separators=(",", ":"), ensure_ascii=False).encode()
                  body = struct.pack("<I", len(metadata_bytes)) + metadata_bytes + struct.pack("<I", len(crate_bytes)) + crate_bytes
                  request = urllib.request.Request("https://crates.io/api/v1/crates/new", data=body, method="PUT", headers={"Authorization": token, "Content-Type": "application/octet-stream", "Accept": "application/json"})
                  submitted = True
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          if response.status not in (200, 201):
                              raise SystemExit(f"{name} upload returned HTTP {response.status}")
                  except urllib.error.HTTPError as error:
                      if error.code == 429 or error.code >= 500:
                          time.sleep(6)
                          continue
                      raise
                  time.sleep(6)
              else:
                  raise SystemExit(f"crates.io did not expose exact {name}@{version} bytes")
              print(f"published or reconciled {name}@{version}")
          PY

  reconstruct-publication:
    name: Reconstruct Completion Manifest
    needs:
      - preflight
      - publish-rust
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source-commit }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.package-artifact-id }}
          path: dist/platform-packages
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Verify original immutable package artifact
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source-commit }}
        run: |
          node scripts/platform_package_build.mjs verify \
            dist/platform-packages/platform-package-build-v1.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync(
            "dist/platform-packages/platform-package-build-v1.json",
            "utf8",
          ));
          if (manifest.platform_version !== process.env.VERSION
              || manifest.source_commit !== process.env.SOURCE_COMMIT) {
            throw new Error("original package artifact release identity mismatch");
          }
          NODE
      - name: Independently read back all public registries
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source-commit }}
        run: |
          set -euo pipefail
          mkdir -p dist/readbacks/npm
          node scripts/verify_go_module_readback.mjs \
            "$VERSION" "$SOURCE_COMMIT" dist/readbacks/go-readback.json
          node scripts/verify_rust_registry_release.mjs \
            "$VERSION" "$SOURCE_COMMIT" dist/readbacks/rust-readback.json
          for package_name in @floegence/redevplugin-contracts @floegence/redevplugin-ui; do
            short_name=${package_name##*/}
            integrity=$(node --input-type=module - "$package_name" <<'NODE'
          import { readFileSync } from "node:fs";
          const name = process.argv[2];
          const manifest = JSON.parse(readFileSync("dist/platform-packages/platform-package-build-v1.json", "utf8"));
          const artifact = manifest.artifacts.find((item) => item.name === name);
          if (!artifact) throw new Error(`missing immutable npm artifact ${name}`);
          process.stdout.write(artifact.integrity);
          NODE
            )
            node scripts/verify_npm_registry_release.mjs \
              "$package_name" "$VERSION" "$SOURCE_COMMIT" "$integrity" \
              "dist/readbacks/npm/${short_name}.json"
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const names = ["redevplugin-contracts", "redevplugin-ui"];
          const readbacks = names.map((name) => JSON.parse(
            readFileSync(`dist/readbacks/npm/${name}.json`, "utf8"),
          ));
          writeFileSync("dist/readbacks/npm-readback.json", `${JSON.stringify(readbacks, null, 2)}\n`, { flag: "wx" });
          NODE
      - name: Build canonical publication from registry readbacks
        run: |
          mkdir -p dist/publication
          node scripts/platform_package_publication.mjs create \
            --out dist/publication/platform-package-publication-v1.json \
            --source-commit "${{ needs.preflight.outputs.source-commit }}" \
            --go-readback dist/readbacks/go-readback.json \
            --npm-readback dist/readbacks/npm-readback.json \
            --rust-readback dist/readbacks/rust-readback.json
          node scripts/platform_package_publication.mjs verify \
            dist/publication/platform-package-publication-v1.json \
            "${{ needs.preflight.outputs.version }}" \
            "${{ needs.preflight.outputs.source-commit }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: recovered-platform-publication-${{ needs.preflight.outputs.source-commit }}
          path: dist/publication/platform-package-publication-v1.json
          if-no-files-found: error
          retention-days: 7

  attest-publication:
    name: Attest Recovered Completion Manifest
    needs:
      - reconstruct-publication
      - release-admission
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.reconstruct-publication.outputs.artifact-id }}
          path: dist/publication
          merge-multiple: true
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/publication/platform-package-publication-v1.json

  publish-release:
    name: Publish Recovered Exact-One GitHub Release Asset
    needs:
      - preflight
      - reconstruct-publication
      - attest-publication
      - release-admission
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.reconstruct-publication.outputs.artifact-id }}
          path: dist/publication
          merge-multiple: true
      - name: Atomically publish only the completion manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source-commit }}
          TAG: ${{ inputs.tag }}
          CONTENT_TYPE: application/vnd.floegence.redevplugin-platform-publication.v1+json
        run: |
          set -euo pipefail
          asset_name=platform-package-publication-v1.json
          manifest=dist/publication/platform-package-publication-v1.json
          marker="<!-- redevplugin-release-transaction-v1 source_commit=${SOURCE_COMMIT} -->"
          release_pages=$(mktemp "${RUNNER_TEMP}/redevplugin-release-pages.XXXXXX")
          release_json=$(mktemp "${RUNNER_TEMP}/redevplugin-release.XXXXXX")
          assets_json=$(mktemp "${RUNNER_TEMP}/redevplugin-release-assets.XXXXXX")
          downloaded=$(mktemp "${RUNNER_TEMP}/redevplugin-release-asset.XXXXXX")
          mutation_json=$(mktemp "${RUNNER_TEMP}/redevplugin-release-mutation.XXXXXX")
          bound_release_id=
          create_attempted=false
          cleanup() {
            rm -f "$release_pages" "$release_json" "$assets_json" "$downloaded" "$mutation_json"
          }
          trap cleanup EXIT
          test -f "$manifest"
          test ! -L "$manifest"
          manifest_size=$(wc -c < "$manifest")
          [[ "$manifest_size" =~ ^[1-9][0-9]*$ ]]
          test "$manifest_size" -le 1048576
          manifest_sha256=$(sha256sum "$manifest" | awk '{print $1}')
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]

          verify_local_manifest() {
            local current_sha256 current_size
            test -f "$manifest" && test ! -L "$manifest" || return 2
            current_size=$(wc -c < "$manifest") || return 2
            test "$current_size" = "$manifest_size" || return 2
            current_sha256=$(sha256sum "$manifest" | awk '{print $1}') || return 2
            test "$current_sha256" = "$manifest_sha256" || return 2
          }

          load_release_pages() {
            for attempt in 1 2 3 4; do
              if gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_pages"; then
                break
              fi
              test "$attempt" != 4 || return 2
              sleep "$attempt"
            done
            jq -e 'type == "array" and all(.[]; type == "array" and length <= 100)' "$release_pages" > /dev/null || return 2
          }

          load_bound_release() {
            local release_id=$1 status
            status=$(curl --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$release_json" -w '%{http_code}' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$release_id") || return 2
            test "$status" = 200 || return 2
            jq -e --argjson id "$release_id" --arg tag "$TAG" --arg marker "$marker" '
              .id == $id and
              .tag_name == $tag and
              .prerelease == false and
              (.draft | type == "boolean") and
              ((.body // "") | contains($marker))
            ' "$release_json" > /dev/null || {
              echo "existing release is not the exact bound transaction" >&2
              return 2
            }
          }

          load_assets_for_release() {
            local release_id=$1 status
            status=$(curl --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$assets_json" -w '%{http_code}' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100") || return 2
            test "$status" = 200 || return 2
            jq -e 'type == "array" and length < 100' "$assets_json" > /dev/null || return 2
          }

          validate_empty_bound_draft() {
            local release_id=$1
            load_bound_release "$release_id" || return 1
            test "$(jq -r .draft "$release_json")" = true || return 1
            load_assets_for_release "$release_id" || return 1
            test "$(jq length "$assets_json")" = 0
          }

          validate_exact_bound_public() {
            local release_id=$1
            load_bound_release "$release_id" || return 1
            test "$(jq -r .draft "$release_json")" = false || return 1
            load_assets_for_release "$release_id" || return 1
            exact_asset_matches
          }

          validate_exact_bound_draft() {
            local release_id=$1
            load_bound_release "$release_id" || return 1
            test "$(jq -r .draft "$release_json")" = true || return 1
            load_assets_for_release "$release_id" || return 1
            exact_asset_matches
          }

          normalize_duplicate_releases() {
            local asset_draft_id canonical_id current_id current_ids delete_status duplicate_id public_id
            verify_local_manifest || return 1
            current_ids=$(jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | .id] | sort | .[]' "$release_pages") || return 1
            asset_draft_id=
            public_id=
            for current_id in $current_ids; do
              [[ "$current_id" =~ ^[1-9][0-9]*$ ]] || return 1
              load_bound_release "$current_id" || return 1
              if test "$(jq -r .draft "$release_json")" = false; then
                test -z "$public_id" || return 1
                validate_exact_bound_public "$current_id" || return 1
                public_id=$current_id
              else
                load_assets_for_release "$current_id" || return 1
                if test "$(jq length "$assets_json")" != 0; then
                  test -z "$asset_draft_id" || return 1
                  exact_asset_matches || return 1
                  asset_draft_id=$current_id
                fi
              fi
            done
            test -z "$public_id" || test -z "$asset_draft_id" || return 1
            canonical_id=${public_id:-${asset_draft_id:-$(printf '%s\n' "$current_ids" | head -n 1)}}
            [[ "$canonical_id" =~ ^[1-9][0-9]*$ ]] || return 1
            for duplicate_id in $current_ids; do
              test "$duplicate_id" != "$canonical_id" || continue
              for attempt in 1 2 3 4; do
                load_release_pages || return 1
                if ! jq -e --arg tag "$TAG" --argjson id "$duplicate_id" \
                  'any(.[][]; .tag_name == $tag and .id == $id)' "$release_pages" > /dev/null; then
                  break
                fi
                current_ids=$(jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | .id] | sort | .[]' "$release_pages") || return 1
                printf '%s\n' "$current_ids" | grep -Fx "$canonical_id" > /dev/null || return 1
                for current_id in $current_ids; do
                  if test "$current_id" = "$canonical_id" && test -n "$public_id"; then
                    validate_exact_bound_public "$current_id" || return 1
                  elif test "$current_id" = "$canonical_id" && test -n "$asset_draft_id"; then
                    validate_exact_bound_draft "$current_id" || return 1
                  else
                    validate_empty_bound_draft "$current_id" || return 1
                  fi
                done
                delete_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -o "$mutation_json" -w '%{http_code}' \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$duplicate_id") || delete_status=000
                load_release_pages || return 1
                if ! jq -e --arg tag "$TAG" --argjson id "$duplicate_id" \
                  'any(.[][]; .tag_name == $tag and .id == $id)' "$release_pages" > /dev/null; then
                  break
                fi
                test "$attempt" != 4 || return 1
                sleep "$attempt"
              done
            done
            load_release_pages || return 1
            test "$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$release_pages")" = 1
            test "$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .id' "$release_pages")" = "$canonical_id"
          }

          lookup_release() {
            local match_count release_id
            if test -n "$bound_release_id"; then
              load_bound_release "$bound_release_id"
              return $?
            fi
            load_release_pages || return 2
            match_count=$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$release_pages")
            case "$match_count" in
              0) return 1 ;;
              1) ;;
              *) normalize_duplicate_releases || {
                   echo "release lookup found non-reconcilable exact-tag duplicates" >&2
                   return 2
                 }
                 load_release_pages || return 2 ;;
            esac
            test "$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$release_pages")" = 1 || return 2
            release_id=$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .id' "$release_pages")
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || return 2
            bound_release_id=$release_id
            load_bound_release "$release_id"
          }

          load_assets() {
            local release_id
            release_id=$(jq -r .id "$release_json")
            load_assets_for_release "$release_id"
          }

          exact_asset_matches() {
            local asset_id asset_url metadata_status status
            verify_local_manifest || return 2
            metadata_status=0
            jq -e --arg name "$asset_name" --arg content_type "$CONTENT_TYPE" --argjson size "$manifest_size" '
              length == 1 and
              .[0].name == $name and
              .[0].content_type == $content_type and
              .[0].state == "uploaded" and
              .[0].size == $size and
              (.[0].id | type == "number" and . > 0) and
              (.[0].url | type == "string" and startswith("https://api.github.com/"))
            ' "$assets_json" > /dev/null || metadata_status=$?
            case "$metadata_status" in
              0) ;;
              1) return 1 ;;
              *) return 2 ;;
            esac
            asset_id=$(jq -r '.[0].id' "$assets_json") || return 2
            asset_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            test "$(jq -r '.[0].url' "$assets_json")" = "$asset_url" || return 2
            status=$(curl --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$downloaded" -w '%{http_code}' "$asset_url") || return 2
            test "$status" = 200 || return 2
            verify_local_manifest || return 2
            cmp -s "$manifest" "$downloaded" && return 0
            test "$?" = 1 && return 1
            return 2
          }

          reconcile_public() {
            lookup_release || return 1
            test "$(jq -r .draft "$release_json")" = false || return 1
            load_assets || return 1
            exact_asset_matches
          }

          verify_tag_commit() {
            local object_sha object_type status
            status=$(curl --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$mutation_json" -w '%{http_code}' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG") || return 1
            test "$status" = 200 || return 1
            jq -e --arg ref "refs/tags/$TAG" '
              .ref == $ref and
              (.object.type == "tag" or .object.type == "commit") and
              (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))
            ' "$mutation_json" > /dev/null || return 1
            object_type=$(jq -r '.object.type' "$mutation_json") || return 1
            object_sha=$(jq -r '.object.sha' "$mutation_json") || return 1
            for depth in 1 2 3 4; do
              case "$object_type" in
                commit)
                  test "$object_sha" = "$SOURCE_COMMIT" || return 1
                  return 0
                  ;;
                tag)
                  status=$(curl --silent --show-error --location --retry 3 --retry-all-errors \
                    --connect-timeout 10 --max-time 30 \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -o "$mutation_json" -w '%{http_code}' \
                    "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$object_sha") || return 1
                  test "$status" = 200 || return 1
                  jq -e --arg sha "$object_sha" '
                    .sha == $sha and
                    (.object.type == "tag" or .object.type == "commit") and
                    (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))
                  ' "$mutation_json" > /dev/null || return 1
                  object_type=$(jq -r '.object.type' "$mutation_json") || return 1
                  object_sha=$(jq -r '.object.sha' "$mutation_json") || return 1
                  ;;
                *) return 1 ;;
              esac
            done
            return 1
          }

          ensure_draft_asset() {
            local asset_id delete_status exact_status release_id status upload_url
            load_assets || return 1
            exact_status=0
            exact_asset_matches || exact_status=$?
            case "$exact_status" in
              0) return 0 ;;
              1) ;;
              *) return 1 ;;
            esac
            for asset_id in $(jq -r '.[].id' "$assets_json"); do
              lookup_release || return 1
              test "$(jq -r .draft "$release_json")" = true || return 1
              for attempt in 1 2 3 4; do
                delete_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -o "$mutation_json" -w '%{http_code}' \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id") || delete_status=000
                lookup_release || return 1
                if test "$(jq -r .draft "$release_json")" = false; then
                  reconcile_public || return 1
                  return
                fi
                load_assets || return 1
                if ! jq -e --argjson id "$asset_id" 'any(.[]; .id == $id)' "$assets_json" > /dev/null; then
                  break
                fi
                test "$attempt" != 4 || return 1
                sleep "$attempt"
              done
            done
            load_assets || return 1
            test "$(jq length "$assets_json")" = 0 || return 1
            release_id=$(jq -r .id "$release_json")
            upload_url=$(jq -r '.upload_url | sub("\\{.*$"; "")' "$release_json")
            test "$upload_url" = "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" || return 1
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $CONTENT_TYPE" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"$manifest" \
              -o "$mutation_json" -w '%{http_code}' \
              "${upload_url}?name=${asset_name}") || status=000
            for attempt in 1 2 3 4; do
              lookup_release || return 1
              if test "$(jq -r .draft "$release_json")" = false; then
                reconcile_public || return 1
                return
              fi
              load_assets || return 1
              if exact_asset_matches; then
                return
              fi
              test "$attempt" != 4 || return 1
              sleep "$attempt"
            done
            echo "draft asset upload did not reconcile (HTTP $status)" >&2
            return 1
          }

          create_draft() {
            jq -n --arg tag "$TAG" --arg source "$SOURCE_COMMIT" --arg body "$marker" '{
              tag_name: $tag,
              target_commitish: $source,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
              body: $body
            }' > "$mutation_json" || return 1
            create_attempted=true
            local status
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"$mutation_json" \
              -o "$release_json" -w '%{http_code}' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases") || status=000
            if test "$status" != 201; then
              echo "release draft creation response unavailable (HTTP $status); attempting bounded adoption" >&2
              return 1
            fi
            jq -e --arg tag "$TAG" --arg marker "$marker" '
              (.id | type == "number" and . > 0) and
              .tag_name == $tag and .prerelease == false and .draft == true and
              ((.body // "") | contains($marker))
            ' "$release_json" > /dev/null || return 2
            bound_release_id=$(jq -r .id "$release_json") || return 2
            echo "bound release id=$bound_release_id draft=true assets=0" >&2
          }

          adopt_created_draft() {
            local matches release_id
            load_release_pages || return 2
            matches=$(jq -r --arg tag "$TAG" --arg marker "$marker" '[.[][] | select(.tag_name == $tag and .prerelease == false and .draft == true and ((.body // "") | contains($marker))) | .id] | unique | .[]' "$release_pages") || return 2
            test "$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 || return 1
            release_id=$(printf '%s\n' "$matches" | sed '/^$/d')
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || return 2
            bound_release_id=$release_id
            load_bound_release "$bound_release_id" || return 2
            echo "adopted release id=$bound_release_id draft=true" >&2
          }

          verify_tag_commit
          for attempt in 1 2 3 4; do
            lookup_status=0
            lookup_release || lookup_status=$?
            if test "$lookup_status" = 1; then
              if test "$create_attempted" = true; then
                adopt_created_draft || {
                  sleep "$attempt"
                  continue
                }
              else
                create_draft || {
                  adopt_created_draft || {
                    sleep "$attempt"
                    continue
                  }
                }
              fi
              sleep "$attempt"
              continue
            fi
            test "$lookup_status" = 0
            if test "$(jq -r .draft "$release_json")" = false; then
              reconcile_public
              exit 0
            fi
            ensure_draft_asset
            lookup_release
            if test "$(jq -r .draft "$release_json")" = false; then
              reconcile_public
              exit 0
            fi
            release_id=$(jq -r .id "$release_json")
            jq -n '{draft: false, make_latest: "true"}' > "$mutation_json"
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"$mutation_json" \
              -o /dev/null \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$release_id" || true
            sleep "$attempt"
            if reconcile_public; then
              exit 0
            fi
          done
          echo "release publication did not converge" >&2
          exit 1

  verify-release:
    name: Verify Recovered Public Completion
    needs:
      - preflight
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source-commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download and verify exact public bytes and attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CONTENT_TYPE: application/vnd.floegence.redevplugin-platform-publication.v1+json
        run: |
          set -euo pipefail
          ./scripts/verify_github_release_identity.sh --require-release \
            "$GITHUB_REPOSITORY" "$TAG" "${{ needs.preflight.outputs.source-commit }}"
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq length)" = 1
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[0].content_type')" = "$CONTENT_TYPE"
          mkdir -p dist/published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist/published
          node scripts/platform_package_publication.mjs verify \
            dist/published \
            "${{ needs.preflight.outputs.version }}" \
            "${{ needs.preflight.outputs.source-commit }}"
          gh attestation verify \
            dist/published/platform-package-publication-v1.json \
            --repo "$GITHUB_REPOSITORY"
